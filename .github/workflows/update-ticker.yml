name: Update ticker and content

on:
  schedule:
    # Sundays 17:23 UTC (17:23 London in winter, 18:23 in summer).
    # Off the hour because GitHub delays jobs queued at :00.
    - cron: '23 17 * * 0'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run (ticker or content)'
        required: true
        default: 'ticker'
        type: choice
        options:
          - ticker
          - content

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ticker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: >-
      (github.event_name == 'schedule' && github.event.schedule != '0 8 * * 1') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'ticker')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install anthropic
      - run: python update_ticker.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Scheduled content updates run from update-content.yml (Mondays).
  # This job is kept for manual runs only.
  content:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'content')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install anthropic
      - run: python update_content.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
